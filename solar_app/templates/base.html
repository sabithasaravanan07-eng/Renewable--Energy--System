<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Solar Energy System{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <style>
    body { background:#f5f7fa; }
    .navbar-brand { font-weight: 600; }
    .card { border-radius: .75rem; }
    footer { color:#8a94a6; font-size:.85rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">Solar Energy System</a>
      <div class="navbar-nav">
        <a class="nav-link" href="{{ url_for('input_page') }}">New Estimate</a>
        <a class="nav-link" href="{{ url_for('results') }}">Results</a>
        <a class="nav-link" href="{{ url_for('prediction') }}">Model</a>
        <a class="nav-link" href="{{ url_for('forecast') }}">Forecast</a>
      </div>
    </div>
  </nav>
  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>
  <div class="container">
    <footer class="border-top pt-3 pb-4">Demonstration project for educational use. See README for methodology.</footer>
  </div>
</body>
</html>
