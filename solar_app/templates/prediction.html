{% extends "base.html" %}
{% block title %}Model{% endblock %}
{% block content %}
{% if not result %}
<div class="alert alert-info">No estimate yet. <a href="{{ url_for('input_page') }}">Run one now</a>.</div>
{% else %}
<div class="card shadow-sm">
  <div class="card-body">
    <h1 class="h4">Selected Model: {{ result.model_name }}</h1>
    <table class="table w-auto">
      <tbody>
        {% for key, value in result.metrics.items() %}
        <tr><th class="text-capitalize">{{ key }}</th><td>{{ value }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endif %}
{% endblock %}
